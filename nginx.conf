server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React app for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets can be cached safely for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Don't leave browsers with a stale app shell after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
